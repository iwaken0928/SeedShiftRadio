name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Run Docker-free server verification
        run: ./gradlew test

  server-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Run Docker-backed verification
        run: ./gradlew dockerTest

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run web typecheck
        run: npm run typecheck

  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run web unit tests
        run: npm test

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      - name: Run web end-to-end tests
        run: npm run e2e

  worker-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/musicgen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            workers/musicgen/requirements.txt
            workers/musicgen/requirements-dev.txt
      - name: Install worker dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run worker contract tests
        run: python -m pytest tests/test_main.py
