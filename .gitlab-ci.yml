stages:
  - validate
  - test
  - build
  - publish
  - migrate
  - deploy
  - smoke
  - docs-check

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  interruptible: true
  tags:
    - shared
    - shell

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  TESTCONTAINERS_CHECKS_DISABLE: "true"
  PODMAN_TEST_JAVA_IMAGE: "docker.io/eclipse-temurin:21-jdk"
  PODMAN_TEST_NODE_IMAGE: "docker.io/node:22-bookworm"
  PODMAN_TEST_PYTHON_IMAGE: "docker.io/python:3.12-slim"
  PODMAN_TEST_PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.55.0-jammy"
  PODMAN_TEST_RUBY_IMAGE: "docker.io/ruby:3.3-alpine"
  SEEDSHIFT_LOCAL_IMAGE_REPOSITORY: "localhost/seedshift-radio"
  SEEDSHIFT_RADIO_DB_NAME: "seedshift_radio"
  SEEDSHIFT_RADIO_DB_USERNAME: "seedshift"
  SERVER_INTERNAL_API_BASE_URL: "http://127.0.0.1:8080"
  SAST_EXCLUDED_PATHS: "spec,test,tests,tmp,build,target"

# Shell executor Runner 用
# 対象Runnerタグ: shared, shell
.test-job:
  tags:
    - shared
    - shell
  before_script:
    - set -euo pipefail

.deploy-job:
  tags:
    - shared
    - deploy
  before_script:
    - set -euo pipefail

.container-build-job:
  tags:
    - shared
    - shell
  before_script:
    - set -euo pipefail

.main-manual-deploy:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never

semgrep-sast:
  tags:
    - shared
    - docker
  variables:
    TMPDIR: "$CI_PROJECT_DIR/.tmp"
    TMP: "$CI_PROJECT_DIR/.tmp"
    TEMP: "$CI_PROJECT_DIR/.tmp"
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.tmp"

spotbugs-sast:
  tags:
    - shared
    - docker
  variables:
    TMPDIR: "$CI_PROJECT_DIR/.tmp"
    TMP: "$CI_PROJECT_DIR/.tmp"
    TEMP: "$CI_PROJECT_DIR/.tmp"
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.tmp"

kics-iac-sast:
  tags:
    - shared
    - docker
  variables:
    TMPDIR: "$CI_PROJECT_DIR/.tmp"
    TMP: "$CI_PROJECT_DIR/.tmp"
    TEMP: "$CI_PROJECT_DIR/.tmp"
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.tmp"
  script:
    - >
      kics scan --ci
      --path "$CI_PROJECT_DIR"
      --queries-path /usr/local/bin/assets/queries
      --disable-full-descriptions
      --disable-secrets
      --log-level DEBUG
      --output-path "$CI_PROJECT_DIR/.tmp"
      --output-name kics
      --report-formats glsast
      --ignore-on-exit results
    - mv "$CI_PROJECT_DIR/.tmp/gl-sast-kics.json" "$CI_PROJECT_DIR/gl-sast-report.json"

secret_detection:
  tags:
    - shared
    - docker
  variables:
    TMPDIR: "$CI_PROJECT_DIR/.tmp"
    TMP: "$CI_PROJECT_DIR/.tmp"
    TEMP: "$CI_PROJECT_DIR/.tmp"
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.tmp"

server-unit:
  extends: .test-job
  stage: test
  script:
    - podman --remote pull "${PODMAN_TEST_JAVA_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --security-opt=label=disable
      -e HOME=/tmp/home
      -e GRADLE_USER_HOME=/workspace/.gradle
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace
      "${PODMAN_TEST_JAVA_IMAGE}"
      sh -lc 'mkdir -p "$HOME" && chmod +x ./gradlew && ./gradlew test'

api-contract:
  extends: .test-job
  stage: test
  script:
    - podman --remote pull "${PODMAN_TEST_JAVA_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --security-opt=label=disable
      -e HOME=/tmp/home
      -e GRADLE_USER_HOME=/workspace/.gradle
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace
      "${PODMAN_TEST_JAVA_IMAGE}"
      sh -lc 'mkdir -p "$HOME" && chmod +x ./gradlew && ./gradlew apiContractTest'

server-docker:
  extends: .test-job
  stage: test
  script:
    - podman --remote info
    - export PODMAN_REMOTE_SOCKET_PATH="${PODMAN_REMOTE_SOCKET_PATH:-$(podman --remote info --format '{{.Host.RemoteSocket.Path}}' | sed 's#^unix://##')}"
    - export PODMAN_REMOTE_SOCKET_URI="unix://${PODMAN_REMOTE_SOCKET_PATH}"
    - export PODMAN_REMOTE_RUNTIME_DIR="$(dirname "$(dirname "${PODMAN_REMOTE_SOCKET_PATH}")")"
    - echo "Using remote Podman socket path ${PODMAN_REMOTE_SOCKET_PATH}"
    - echo "Using remote Podman runtime dir ${PODMAN_REMOTE_RUNTIME_DIR}"
    - podman --remote pull "${PODMAN_TEST_JAVA_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --network=host
      --security-opt=label=disable
      -e HOME=/tmp/home
      -e GRADLE_USER_HOME=/workspace/.gradle
      -e XDG_RUNTIME_DIR="${PODMAN_REMOTE_RUNTIME_DIR}"
      -e TESTCONTAINERS_RYUK_DISABLED="${TESTCONTAINERS_RYUK_DISABLED}"
      -e TESTCONTAINERS_CHECKS_DISABLE="${TESTCONTAINERS_CHECKS_DISABLE}"
      -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1
      -e TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE="${PODMAN_REMOTE_SOCKET_PATH}"
      -e DOCKER_HOST="${PODMAN_REMOTE_SOCKET_URI}"
      -v "${CI_PROJECT_DIR}:/workspace"
      -v "${PODMAN_REMOTE_RUNTIME_DIR}:${PODMAN_REMOTE_RUNTIME_DIR}"
      -w /workspace
      "${PODMAN_TEST_JAVA_IMAGE}"
      sh -lc 'mkdir -p "$HOME" && chmod +x ./gradlew && ./gradlew dockerTest --stacktrace --info'

web-typecheck:
  extends: .test-job
  stage: test
  script:
    - podman --remote pull "${PODMAN_TEST_NODE_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --security-opt=label=disable
      -e HOME=/tmp/home
      -e npm_config_cache=/tmp/npm-cache
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace/web
      "${PODMAN_TEST_NODE_IMAGE}"
      sh -lc 'mkdir -p "$HOME" && npm ci && npm run typecheck'

web-unit:
  extends: .test-job
  stage: test
  script:
    - podman --remote pull "${PODMAN_TEST_NODE_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --security-opt=label=disable
      -e HOME=/tmp/home
      -e npm_config_cache=/tmp/npm-cache
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace/web
      "${PODMAN_TEST_NODE_IMAGE}"
      sh -lc 'mkdir -p "$HOME" && npm ci && npm test'

web-e2e:
  extends: .test-job
  stage: test
  variables:
    PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3001"
    E2E_WEB_ADMIN_PASSWORD: "playwright-login-password"
    E2E_WEB_SESSION_SECRET: "playwright-session-secret-at-least-32-bytes"
    E2E_ADMIN_TOKEN: "playwright-server-admin-token"
  script:
    - podman --remote pull "${PODMAN_TEST_PLAYWRIGHT_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --ipc=host
      --security-opt=label=disable
      -e HOME=/tmp/home
      -e npm_config_cache=/tmp/npm-cache
      -e CI
      -e PLAYWRIGHT_BASE_URL
      -e E2E_WEB_ADMIN_PASSWORD
      -e E2E_WEB_SESSION_SECRET
      -e E2E_ADMIN_TOKEN
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace/web
      "${PODMAN_TEST_PLAYWRIGHT_IMAGE}"
      sh -lc 'mkdir -p "$HOME" && npm ci && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium && npm run e2e'

worker-contract:
  extends: .test-job
  stage: test
  script:
    - podman --remote pull "${PODMAN_TEST_PYTHON_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --security-opt=label=disable
      -e HOME=/tmp/home
      -e PIP_CACHE_DIR=/tmp/pip-cache
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace/workers/musicgen
      "${PODMAN_TEST_PYTHON_IMAGE}"
      sh -lc 'mkdir -p "$HOME" && python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-dev.txt && python3 -m pytest tests/test_main.py'


ci-yaml-validate:
  extends: .test-job
  stage: validate
  script:
    - podman --remote pull "${PODMAN_TEST_RUBY_IMAGE}"
    - >
      podman --remote run --rm --pull=never
      --userns=keep-id
      --security-opt=label=disable
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace
      "${PODMAN_TEST_RUBY_IMAGE}"
      ruby -e "require 'yaml'; YAML.load_file('.gitlab-ci.yml'); puts 'gitlab-ci-yaml-ok'"

compose-prod-validate:
  extends: .test-job
  stage: validate
  script:
    - export SEEDSHIFT_SERVER_IMAGE=localhost/seedshift-radio/server:validate
    - export SEEDSHIFT_WEB_IMAGE=localhost/seedshift-radio/web:validate
    - export SEEDSHIFT_RADIO_DB_NAME=seedshift_radio
    - export SEEDSHIFT_RADIO_DB_USERNAME=seedshift
    - export SEEDSHIFT_RADIO_DB_PASSWORD=validate-password
    - export SEEDSHIFT_ADMIN_TOKEN=validate-token
    - export SEEDSHIFT_WEB_ADMIN_PASSWORD=validate-password
    - export SEEDSHIFT_WEB_SESSION_SECRET=validate-session-secret-at-least-32-bytes
    - podman --remote compose -f infra/compose/compose.prod.yml config >/dev/null

server-container-build:
  extends: .container-build-job
  stage: build
  script:
    - export SEEDSHIFT_SERVER_IMAGE_COMMIT="${SEEDSHIFT_LOCAL_IMAGE_REPOSITORY}/server:${CI_COMMIT_SHORT_SHA}"
    - podman --remote build --pull -t "${SEEDSHIFT_SERVER_IMAGE_COMMIT}" -f infra/containers/server.Containerfile .

web-container-build:
  extends: .container-build-job
  stage: build
  script:
    - export SEEDSHIFT_WEB_IMAGE_COMMIT="${SEEDSHIFT_LOCAL_IMAGE_REPOSITORY}/web:${CI_COMMIT_SHORT_SHA}"
    - >
      podman --remote build --pull
      -t "${SEEDSHIFT_WEB_IMAGE_COMMIT}"
      -f infra/containers/web.Containerfile web

server-container-publish:
  extends: .container-build-job
  stage: publish
  script:
    - export SEEDSHIFT_IMAGE_REPOSITORY="${SEEDSHIFT_IMAGE_REPOSITORY:-${CI_REGISTRY_IMAGE:-${SEEDSHIFT_LOCAL_IMAGE_REPOSITORY}}}"
    - export SEEDSHIFT_SERVER_IMAGE_COMMIT="${SEEDSHIFT_IMAGE_REPOSITORY}/server:${CI_COMMIT_SHORT_SHA}"
    - export SEEDSHIFT_SERVER_IMAGE_REF="${SEEDSHIFT_IMAGE_REPOSITORY}/server:${CI_COMMIT_REF_SLUG}"
    - podman --remote build --pull -t "${SEEDSHIFT_SERVER_IMAGE_COMMIT}" -t "${SEEDSHIFT_SERVER_IMAGE_REF}" -f infra/containers/server.Containerfile .
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        podman --remote login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
        podman --remote push "${SEEDSHIFT_SERVER_IMAGE_COMMIT}"
        podman --remote push "${SEEDSHIFT_SERVER_IMAGE_REF}"
      else
        echo "CI_REGISTRY is not configured; keeping server image in local Podman storage."
      fi

web-container-publish:
  extends: .container-build-job
  stage: publish
  script:
    - export SEEDSHIFT_IMAGE_REPOSITORY="${SEEDSHIFT_IMAGE_REPOSITORY:-${CI_REGISTRY_IMAGE:-${SEEDSHIFT_LOCAL_IMAGE_REPOSITORY}}}"
    - export SEEDSHIFT_WEB_IMAGE_COMMIT="${SEEDSHIFT_IMAGE_REPOSITORY}/web:${CI_COMMIT_SHORT_SHA}"
    - export SEEDSHIFT_WEB_IMAGE_REF="${SEEDSHIFT_IMAGE_REPOSITORY}/web:${CI_COMMIT_REF_SLUG}"
    - >
      podman --remote build --pull
      -t "${SEEDSHIFT_WEB_IMAGE_COMMIT}"
      -t "${SEEDSHIFT_WEB_IMAGE_REF}"
      -f infra/containers/web.Containerfile web
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        podman --remote login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
        podman --remote push "${SEEDSHIFT_WEB_IMAGE_COMMIT}"
        podman --remote push "${SEEDSHIFT_WEB_IMAGE_REF}"
      else
        echo "CI_REGISTRY is not configured; keeping web image in local Podman storage."
      fi

deploy-migrate:
  extends:
    - .deploy-job
    - .main-manual-deploy
  stage: migrate
  resource_group: seedshift-radio-deploy
  script:
    - export SEEDSHIFT_IMAGE_REPOSITORY="${SEEDSHIFT_IMAGE_REPOSITORY:-${CI_REGISTRY_IMAGE:-${SEEDSHIFT_LOCAL_IMAGE_REPOSITORY}}}"
    - sh scripts/ci/require-env.sh SEEDSHIFT_RADIO_DB_PASSWORD SEEDSHIFT_ADMIN_TOKEN
    - export SEEDSHIFT_SERVER_IMAGE="${SEEDSHIFT_IMAGE_REPOSITORY}/server:${CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        podman --remote login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
        podman --remote pull "${SEEDSHIFT_SERVER_IMAGE}"
      else
        echo "CI_REGISTRY is not configured; using local server image ${SEEDSHIFT_SERVER_IMAGE}."
      fi
    - >
      podman --remote run --rm --pull=never
      --network=host
      --security-opt=label=disable
      -e SERVER_ADDRESS=127.0.0.1
      -e SEEDSHIFT_RADIO_DB_HOST="${SEEDSHIFT_RADIO_DB_HOST:-127.0.0.1}"
      -e SEEDSHIFT_RADIO_DB_PORT="${SEEDSHIFT_RADIO_DB_PORT:-5432}"
      -e SEEDSHIFT_RADIO_DB_NAME="${SEEDSHIFT_RADIO_DB_NAME:-seedshift_radio}"
      -e SEEDSHIFT_RADIO_DB_USERNAME="${SEEDSHIFT_RADIO_DB_USERNAME:-seedshift}"
      -e SEEDSHIFT_RADIO_DB_PASSWORD="${SEEDSHIFT_RADIO_DB_PASSWORD}"
      -e SEEDSHIFT_ADMIN_TOKEN="${SEEDSHIFT_ADMIN_TOKEN}"
      -e SEEDSHIFT_RADIO_CONFIG_PATH=/tmp/seedshift-radio/config.json
      -e SEEDSHIFT_RADIO_MIGRATION_ONLY=true
      -e SEEDSHIFT_RADIO_JOBRUNR_ENABLED=false
      -e JOBRUNR_JOB_SCHEDULER_ENABLED=false
      -e SPRING_MAIN_WEB_APPLICATION_TYPE=none
      "${SEEDSHIFT_SERVER_IMAGE}"

deploy-app:
  extends:
    - .deploy-job
    - .main-manual-deploy
  stage: deploy
  needs:
    - deploy-migrate
  resource_group: seedshift-radio-deploy
  script:
    - export SEEDSHIFT_IMAGE_REPOSITORY="${SEEDSHIFT_IMAGE_REPOSITORY:-${CI_REGISTRY_IMAGE:-${SEEDSHIFT_LOCAL_IMAGE_REPOSITORY}}}"
    - sh scripts/ci/require-env.sh SEEDSHIFT_RADIO_DB_PASSWORD SEEDSHIFT_ADMIN_TOKEN SEEDSHIFT_WEB_ADMIN_PASSWORD SEEDSHIFT_WEB_SESSION_SECRET
    - export SEEDSHIFT_SERVER_IMAGE="${SEEDSHIFT_IMAGE_REPOSITORY}/server:${CI_COMMIT_SHORT_SHA}"
    - export SEEDSHIFT_WEB_IMAGE="${SEEDSHIFT_IMAGE_REPOSITORY}/web:${CI_COMMIT_SHORT_SHA}"
    - export SEEDSHIFT_DEPLOY_DIR="${SEEDSHIFT_DEPLOY_DIR:-$HOME/seedshift-radio-deploy}"
    - DEPLOY_DIR="$(sh scripts/ci/write-prod-env.sh)"
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        podman --remote login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
        podman --remote compose --env-file "${DEPLOY_DIR}/.env" -f "${DEPLOY_DIR}/compose.yml" pull
      else
        echo "CI_REGISTRY is not configured; skipping compose pull and using local images."
      fi
    - podman --remote ps --all
    - podman --remote compose --env-file "${DEPLOY_DIR}/.env" -f "${DEPLOY_DIR}/compose.yml" up -d
    - podman --remote compose --env-file "${DEPLOY_DIR}/.env" -f "${DEPLOY_DIR}/compose.yml" ps

smoke-production:
  extends: .deploy-job
  stage: smoke
  needs:
    - deploy-app
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  script:
    - export SEEDSHIFT_SMOKE_API_BASE_URL="${SEEDSHIFT_SMOKE_API_BASE_URL:-http://127.0.0.1:8080}"
    - export SEEDSHIFT_SMOKE_WEB_BASE_URL="${SEEDSHIFT_SMOKE_WEB_BASE_URL:-http://127.0.0.1:3000}"
    - export SEEDSHIFT_SMOKE_WEB_API_PROXY_BASE_URL="${SEEDSHIFT_SMOKE_WEB_API_PROXY_BASE_URL:-http://127.0.0.1:3000/api-proxy}"
    - |
      for attempt in $(seq 1 30); do
        if curl -fsS "${SEEDSHIFT_SMOKE_API_BASE_URL}/api/health" >/dev/null; then
          break
        fi
        if [ "${attempt}" -eq 30 ]; then
          podman --remote logs "${SEEDSHIFT_SERVER_CONTAINER_NAME:-seedshift-radio-server}" || true
          exit 1
        fi
        sleep 2
      done
    - curl -fsS "${SEEDSHIFT_SMOKE_WEB_BASE_URL}/" >/dev/null
    - curl -fsS "${SEEDSHIFT_SMOKE_WEB_API_PROXY_BASE_URL}/api/health" >/dev/null
    - SEEDSHIFT_SMOKE_REQUIRE_SECURE_COOKIE=true sh scripts/smoke-admin-session.sh
    - podman --remote ps --filter "name=${SEEDSHIFT_SERVER_CONTAINER_NAME:-seedshift-radio-server}"
    - podman --remote ps --filter "name=${SEEDSHIFT_WEB_CONTAINER_NAME:-seedshift-radio-web}"

pipeline-docs-check:
  extends: .test-job
  stage: docs-check
  script:
    - test -f docs/16_パイプライン・コンテナデプロイ仕様書.md
    - test -f docs/17_パイプライン・コンテナデプロイ手順書.md
    - rg -n "Podman Compose|deploy-migrate|smoke-production|SEEDSHIFT_RADIO_DB_HOST|MUSICGEN_DATA_VOLUME" docs/16_パイプライン・コンテナデプロイ仕様書.md docs/11_運用・監視・セキュリティ・テスト設計書.md docs/04_データ構造設計書.md
    - rg -n "GitLab CI/CD Variables|Job 別の必要変数|server-container-publish|deploy-migrate|設定例|local image fallback|Rollback|SEEDSHIFT_RADIO_DB_PASSWORD|SEEDSHIFT_WEB_SESSION_SECRET|smoke-admin-session|CI_REGISTRY|MUSICGEN_DATA_VOLUME" docs/17_パイプライン・コンテナデプロイ手順書.md
    - rg -n "api-contract|apiContractTest|openapi.sha256" docs/02_API仕様書.md docs/11_運用・監視・セキュリティ・テスト設計書.md docs/16_パイプライン・コンテナデプロイ仕様書.md docs/17_パイプライン・コンテナデプロイ手順書.md

gpu-smoke:
  extends: .test-job
  stage: test
  when: manual
  allow_failure: true
  variables:
    GPU_SMOKE_IMAGE: "docker.io/nvidia/cuda:12.4.1-base-ubuntu22.04"
  script:
    - podman --remote info
    - podman --remote pull "${GPU_SMOKE_IMAGE}"
    - podman --remote run --rm --device nvidia.com/gpu=all --security-opt=label=disable "${GPU_SMOKE_IMAGE}" nvidia-smi

deploy-musicgen:
  extends:
    - .deploy-job
    - .main-manual-deploy
  stage: deploy
  resource_group: musicgen-deploy
  script:
    - export MUSICGEN_CONTAINER_NAME="${MUSICGEN_CONTAINER_NAME:-seedshift-radio-musicgen}"
    - export MUSICGEN_IMAGE_NAME="${MUSICGEN_IMAGE_NAME:-localhost/seedshift-radio/musicgen:${CI_COMMIT_SHORT_SHA}}"
    - export MUSICGEN_HOST_BIND="${MUSICGEN_HOST_BIND:-0.0.0.0}"
    - export MUSICGEN_HOST_PORT="${MUSICGEN_HOST_PORT:-28080}"
    - export MUSICGEN_DATA_VOLUME="${MUSICGEN_DATA_VOLUME:-}"
    - podman --remote info
    - podman --remote build -t "${MUSICGEN_IMAGE_NAME}" -f workers/musicgen/Dockerfile.local .
    - podman --remote ps --all
    - |
      if podman --remote container exists "${MUSICGEN_CONTAINER_NAME}"; then
        podman --remote inspect "${MUSICGEN_CONTAINER_NAME}"
        podman --remote stop "${MUSICGEN_CONTAINER_NAME}"
        podman --remote rm "${MUSICGEN_CONTAINER_NAME}"
      fi
    - |
      if [ -n "${MUSICGEN_DATA_VOLUME}" ]; then
        echo "Using configured MusicGen persistent data volume/path."
        podman --remote run -d --name "${MUSICGEN_CONTAINER_NAME}" --restart unless-stopped \
          -p "${MUSICGEN_HOST_BIND}:${MUSICGEN_HOST_PORT}:8000" \
          -v "${MUSICGEN_DATA_VOLUME}:/data:Z" \
          -e SEEDSHIFT_MUSICGEN_DATA_ROOT=/data \
          "${MUSICGEN_IMAGE_NAME}"
      else
        echo "MUSICGEN_DATA_VOLUME is not configured; using container-local /data."
        podman --remote run -d --name "${MUSICGEN_CONTAINER_NAME}" --restart unless-stopped \
          -p "${MUSICGEN_HOST_BIND}:${MUSICGEN_HOST_PORT}:8000" \
          -e SEEDSHIFT_MUSICGEN_DATA_ROOT=/data \
          "${MUSICGEN_IMAGE_NAME}"
      fi
    - podman --remote ps --all
    - podman --remote inspect "${MUSICGEN_CONTAINER_NAME}"
    - |
      for attempt in $(seq 1 20); do
        if podman --remote exec "${MUSICGEN_CONTAINER_NAME}" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" >/dev/null 2>&1; then
          break
        fi
        if [ "${attempt}" -eq 20 ]; then
          podman --remote logs "${MUSICGEN_CONTAINER_NAME}"
          exit 1
        fi
        sleep 1
      done
