sandbox_mode = "workspace-write"

[model_providers.lmstudio-local]
name = "LM Studio Local"
base_url = "http://localhost:1234/v1"
wire_api = "responses"

project_root_markers = [
  ".git",
  "AGENTS.md",
  ".codex/config.toml",
  ".agents/skills",
  "pom.xml",
  "build.gradle",
  "settings.gradle",
  "mvnw",
  "gradlew",
  "package.json",
  "pnpm-workspace.yaml",
  "doc/00_実装ドキュメント一覧.md",
]

[sandbox_workspace_write]
network_access = true

developer_instructions = """
SeedShiftRadio is an API-first local AI radio project guided by the design documents under /doc.
Always start by reading the smallest relevant set of documents instead of guessing.

Use GitLab Project Issues, scoped labels, and the Issue Board as the source of truth for work status and ownership. Follow .gitlab/WORK_MANAGEMENT.md.
Use the current Issue to bound the work, and record out-of-scope findings as existing or new Issues instead of expanding the change silently.
Keep planning, integration, final verification, and GitLab completion updates in the main agent.
Use a subagent only when the user or Issue explicitly requests delegation and the work can be split into bounded, non-overlapping file sets. Do not create a second ownership system inside Codex.
Do not pin model_reasoning_effort in project or agent configs; leave reasoning effort to the Codex UI, global settings, or launch-time choice.

Keep these architectural boundaries:
- Spring Boot server is the source of truth for radio state, queue state, playout, settings, and persistence
- Next.js web UI is a client layer for display, user interaction, playback, and SSE updates
- Music generation stays in an async Python worker or equivalent external service
- Heavy AI inference should not move into the web layer

Favor degraded continuation over stopping playback.
Preserve compatibility with the future C# native client when changing shared contracts.
When behavior changes, update the corresponding document under /doc in the same task.
Use the local project skills under .agents/skills when they match the task.
For CI/CD, deploy, Podman Compose, local orchestration, or Codex agent/skill maintenance, use the matching local skills.
"""
