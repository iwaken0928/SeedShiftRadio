name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Run local verification
        run: ./gradlew test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Run Docker-backed verification
        run: ./gradlew dockerTest
