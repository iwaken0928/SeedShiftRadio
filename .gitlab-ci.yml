stages:
  - test
  - deploy

default:
  interruptible: true

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  TESTCONTAINERS_CHECKS_DISABLE: "true"

.test-job:
  tags:
    - shared
    - test
  before_script:
    - set -euo pipefail

.deploy-job:
  tags:
    - shared
    - deploy
  before_script:
    - set -euo pipefail

.main-manual-deploy:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never

server-unit:
  extends: .test-job
  stage: test
  script:
    - chmod +x ./gradlew
    - ./gradlew test

server-docker:
  extends: .test-job
  stage: test
  script:
    - chmod +x ./gradlew
    - podman --remote info
    - |
      if [ -n "${TESTCONTAINERS_DOCKER_HOST:-}" ]; then
        export DOCKER_HOST="${TESTCONTAINERS_DOCKER_HOST}"
      fi
      if [ -z "${DOCKER_HOST:-}" ]; then
        echo "Set TESTCONTAINERS_DOCKER_HOST or DOCKER_HOST to the Podman service endpoint before running dockerTest." >&2
        exit 1
      fi
      echo "Using DOCKER_HOST=${DOCKER_HOST}"
    - ./gradlew dockerTest

web-typecheck:
  extends: .test-job
  stage: test
  script:
    - cd web
    - npm ci
    - npm run typecheck

web-unit:
  extends: .test-job
  stage: test
  script:
    - cd web
    - npm ci
    - npm test

web-e2e:
  extends: .test-job
  stage: test
  script:
    - cd web
    - npm ci
    - PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
    - npm run e2e

worker-contract:
  extends: .test-job
  stage: test
  script:
    - cd workers/musicgen
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -r requirements-dev.txt
    - python3 -m pytest tests/test_main.py

gpu-smoke:
  extends: .test-job
  stage: test
  when: manual
  allow_failure: true
  variables:
    GPU_SMOKE_IMAGE: "docker.io/nvidia/cuda:12.4.1-base-ubuntu22.04"
  script:
    - podman --remote info
    - podman --remote pull "${GPU_SMOKE_IMAGE}"
    - podman --remote run --rm --device nvidia.com/gpu=all --security-opt=label=disable "${GPU_SMOKE_IMAGE}" nvidia-smi

deploy-musicgen:
  extends:
    - .deploy-job
    - .main-manual-deploy
  stage: deploy
  resource_group: musicgen-deploy
  script:
    - export MUSICGEN_CONTAINER_NAME="${MUSICGEN_CONTAINER_NAME:-seedshift-radio-musicgen}"
    - export MUSICGEN_IMAGE_NAME="${MUSICGEN_IMAGE_NAME:-localhost/seedshift-radio/musicgen:${CI_COMMIT_SHORT_SHA}}"
    - export MUSICGEN_HOST_PORT="${MUSICGEN_HOST_PORT:-8000}"
    - export MUSICGEN_DATA_DIR="${MUSICGEN_DATA_DIR:-$HOME/containers/seedshift-radio/musicgen-data}"
    - mkdir -p "${MUSICGEN_DATA_DIR}"
    - podman --remote info
    - podman --remote build -t "${MUSICGEN_IMAGE_NAME}" -f workers/musicgen/Dockerfile.local .
    - podman --remote ps --all
    - |
      if podman --remote container exists "${MUSICGEN_CONTAINER_NAME}"; then
        podman --remote inspect "${MUSICGEN_CONTAINER_NAME}"
        podman --remote stop "${MUSICGEN_CONTAINER_NAME}"
        podman --remote rm "${MUSICGEN_CONTAINER_NAME}"
      fi
    - podman --remote run -d --name "${MUSICGEN_CONTAINER_NAME}" --restart unless-stopped -p "127.0.0.1:${MUSICGEN_HOST_PORT}:8000" -e SEEDSHIFT_MUSICGEN_DATA_ROOT=/data -v "${MUSICGEN_DATA_DIR}:/data" "${MUSICGEN_IMAGE_NAME}"
    - podman --remote ps --all
    - podman --remote inspect "${MUSICGEN_CONTAINER_NAME}"
    - curl --fail --silent --show-error "http://127.0.0.1:${MUSICGEN_HOST_PORT}/health"
