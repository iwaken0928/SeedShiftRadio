spring.application.name=seedshift-radio-server

server.address=127.0.0.1
server.port=${SEEDSHIFT_RADIO_SERVER_PORT:8080}
spring.jackson.default-property-inclusion=non_null

spring.datasource.url=jdbc:postgresql://${SEEDSHIFT_RADIO_DB_HOST:127.0.0.1}:${SEEDSHIFT_RADIO_DB_PORT:5432}/${SEEDSHIFT_RADIO_DB_NAME:seedshift_radio}
spring.datasource.username=${SEEDSHIFT_RADIO_DB_USERNAME:seedshift}
spring.datasource.password=${SEEDSHIFT_RADIO_DB_PASSWORD:seedshift}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

seedshift.radio.security.admin-token=${SEEDSHIFT_ADMIN_TOKEN:}
seedshift.radio.config.path=${SEEDSHIFT_RADIO_CONFIG_PATH:./data/config/config.json}

jobrunr.job-scheduler.enabled=true
jobrunr.jobs.metrics.enabled=true
jobrunr.background-job-server.enabled=${SEEDSHIFT_RADIO_JOBRUNR_ENABLED:true}
jobrunr.background-job-server.metrics.enabled=true
jobrunr.dashboard.enabled=false
